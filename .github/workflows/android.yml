name: Reality3D build

# Branches are built through their pull request, so a push to one doesn't use the Actions minutes twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reality3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build, test and lint Reality3D
        run: gradle --no-daemon --stacktrace :reality3d:assembleRelease :reality3d:testDebugUnitTest :reality3d:lintDebug

      - name: Upload Reality3D APK
        uses: actions/upload-artifact@v4
        with:
          name: Reality3D-apk
          path: reality3d/build/outputs/apk/release/*.apk

      - name: Upload Reality3D reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reality3D-reports
          path: |
            reality3d/build/reports
            reality3d/build/test-results
          if-no-files-found: ignore

      - name: Publish latest Reality3D build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reality3d/build/outputs/apk/release/reality3d-release.apk Reality3D.apk
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-build Reality3D.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Reality3D build #${GITHUB_RUN_NUMBER}" \
            --notes "Reality3D Android build from ${GITHUB_SHA::7}."

  server:
    # The companion server for full 3D from an image-to-3D AI on the user's computer.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test the Reality3D server
        working-directory: reality3d-server
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q tests
